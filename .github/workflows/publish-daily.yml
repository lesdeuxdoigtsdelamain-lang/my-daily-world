name: Publish Daily
on:
  schedule:
    - cron: '20 15 * * *'
      timezone: Europe/London
    - cron: '15 16 * * *'
      timezone: Europe/London
    - cron: '0 17 * * *'
      timezone: Europe/London
  workflow_dispatch:
    inputs:
      force_refresh:
        description: 'Admin only: replace today’s validated edition (keeps the same edition ID)'
        type: boolean
        default: false
      smoke_test:
        description: 'Only test Cloudflare securely; do not publish or consume a full edition quota'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: daily-publication
  cancel-in-progress: false
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: generator/requirements.lock
      - name: Install locked dependencies
        run: python -m pip install -r generator/requirements.lock
      - name: Run offline validation tests
        run: python -m pytest -q generator/tests
      - name: Restore validated publication history
        if: ${{ !inputs.smoke_test }}
        run: python -m generator.app.ci_state restore
      - name: Generate or securely smoke-test
        env:
          AI_PROVIDER: ${{ vars.AI_PROVIDER || 'cloudflare' }}
          CLOUDFLARE_MODEL: ${{ vars.CLOUDFLARE_MODEL || '@cf/meta/llama-3.3-70b-instruct-fp8-fast' }}
          CLOUDFLARE_FALLBACK_MODEL: ${{ vars.CLOUDFLARE_FALLBACK_MODEL || '' }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          MDW_SMOKE: ${{ inputs.smoke_test || false }}
          MDW_FORCE: ${{ inputs.force_refresh || false }}
        run: |
          args=()
          if [ "$MDW_SMOKE" = "true" ]; then args+=(--smoke); fi
          if [ "$MDW_FORCE" = "true" ]; then args+=(--force-refresh); fi
          python -m generator.app.main "${args[@]}"
      - name: Validate and retain publication state
        if: ${{ !inputs.smoke_test }}
        run: |
          python -m generator.app.validate_site site
          python -m generator.app.ci_state save
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        if: ${{ !inputs.smoke_test }}
        with:
          path: site
  deploy:
    if: ${{ !inputs.smoke_test }}
    needs: generate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy validated Pages artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
