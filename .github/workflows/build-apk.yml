name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['android/**', 'generator/**', 'schema/**', 'data/**', '.github/workflows/build-apk.yml']
  pull_request:
permissions:
  contents: read
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install -r generator/requirements.lock
          python -m pytest -q generator/tests
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Run Android checks (debug APK is not distributed)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug
      - name: Restore permanent signing key from encrypted Actions secrets
        if: ${{ github.event_name != 'pull_request' }}
        env:
          MDW_KEYSTORE_BASE64: ${{ secrets.MDW_KEYSTORE_BASE64 }}
          MDW_STORE_PASSWORD: ${{ secrets.MDW_STORE_PASSWORD }}
          MDW_KEY_ALIAS: ${{ secrets.MDW_KEY_ALIAS }}
          MDW_KEY_PASSWORD: ${{ secrets.MDW_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$MDW_KEYSTORE_BASE64" ] || [ -z "$MDW_STORE_PASSWORD" ] || [ -z "$MDW_KEY_ALIAS" ] || [ -z "$MDW_KEY_PASSWORD" ]; then
            echo 'ERROR: Missing signing secret. Configure all four MDW_* GitHub Actions repository secrets. No unsigned APK will be published.' >&2
            exit 1
          fi
          keypath="$RUNNER_TEMP/my-daily-world-permanent.p12"
          printf '%s' "$MDW_KEYSTORE_BASE64" | base64 --decode > "$keypath"
          chmod 600 "$keypath"
          echo "MDW_KEYSTORE_PATH=$keypath" >> "$GITHUB_ENV"
          keytool -list -keystore "$keypath" -storepass "$MDW_STORE_PASSWORD" -alias "$MDW_KEY_ALIAS" > /dev/null
      - name: Build permanently signed release APK
        if: ${{ github.event_name != 'pull_request' }}
        working-directory: android
        env:
          MDW_STORE_PASSWORD: ${{ secrets.MDW_STORE_PASSWORD }}
          MDW_KEY_ALIAS: ${{ secrets.MDW_KEY_ALIAS }}
          MDW_KEY_PASSWORD: ${{ secrets.MDW_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          ./gradlew --no-daemon assembleRelease
          test -s app/build/outputs/apk/release/app-release.apk
          mkdir -p ../artifacts
          cp app/build/outputs/apk/release/app-release.apk ../artifacts/My-Daily-World.apk
          (cd ../artifacts && sha256sum My-Daily-World.apk > SHA256SUMS.txt)
      - name: Upload signed app (no temporary debug builds)
        if: ${{ github.event_name != 'pull_request' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: My-Daily-World-SIGNED
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
      - name: Remove signing key from runner
        if: ${{ always() && github.event_name != 'pull_request' }}
        run: rm -f "$RUNNER_TEMP/my-daily-world-permanent.p12"
