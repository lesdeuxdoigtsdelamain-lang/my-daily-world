name: Build APK
on:
  workflow_dispatch:
    inputs:
      signed_release:
        type: boolean
        default: false
        description: 'Build a parent-signed release only if signing secrets were explicitly configured'
  push:
    branches: [main]
    paths: ['android/**', 'generator/**', 'schema/**', 'data/**', '.github/workflows/build-apk.yml']
  pull_request:
permissions:
  contents: read
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install -r generator/requirements.lock
          python -m pytest -q generator/tests
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Check Gradle distribution and build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug
      - name: Prepare downloadable APK
        run: |
          mkdir -p artifacts
          cp android/app/build/outputs/apk/debug/app-debug.apk artifacts/My-Daily-World-debug.apk
          (cd artifacts && sha256sum My-Daily-World-debug.apk > SHA256SUMS.txt)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: My-Daily-World-debug
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
      - name: Build optional parent-signed release
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.signed_release }}
        env:
          MDW_KEYSTORE_BASE64: ${{ secrets.MDW_KEYSTORE_BASE64 }}
          MDW_STORE_PASSWORD: ${{ secrets.MDW_STORE_PASSWORD }}
          MDW_KEY_ALIAS: ${{ secrets.MDW_KEY_ALIAS }}
          MDW_KEY_PASSWORD: ${{ secrets.MDW_KEY_PASSWORD }}
        working-directory: android
        run: |
          set -euo pipefail
          : "${MDW_KEYSTORE_BASE64:?Configure the parent keystore secret first}"
          export MDW_KEYSTORE_PATH="$RUNNER_TEMP/my-daily-world-parent.jks"
          trap 'rm -f "$MDW_KEYSTORE_PATH"' EXIT
          printf '%s' "$MDW_KEYSTORE_BASE64" | base64 --decode > "$MDW_KEYSTORE_PATH"
          chmod 600 "$MDW_KEYSTORE_PATH"
          ./gradlew --no-daemon assembleRelease
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.signed_release }}
        with:
          name: my-daily-world-parent-signed-release
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
